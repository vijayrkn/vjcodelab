<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F7F5F0; color: #2A2B28;
    font-family: "Iowan Old Style", "Charter", "New York", Georgia, serif;
    box-sizing: border-box; padding: 96px 104px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .mark { width: 76px; height: 76px; }
  h1 { font-weight: 400; font-size: 104px; letter-spacing: -0.02em; line-height: 1; margin: 40px 0 26px; }
  p { font-size: 42px; font-style: italic; color: #5B5C56; margin: 0; }
  footer {
    border-top: 1.5px solid rgba(42,43,40,.16); padding-top: 26px;
    font: 500 22px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .08em; text-transform: uppercase; color: #6A6B65;
    display: flex; justify-content: space-between;
  }
  footer span:last-child { color: #56684D; }
</style>
<body>
  <div>
    <svg class="mark" viewBox="0 0 32 32" fill="none"><path d="M11.5 8.5 5 16l6.5 7.5M20.5 8.5 27 16l-6.5 7.5" stroke="#2A2B28" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.9" fill="#6E8164"/></svg>
    <h1>VJ CodeLab</h1>
    <p>A space for ideas and experiments.</p>
  </div>
  <footer><span>An independent software lab</span><span>vjcodelab.com</span></footer>
</body>
</html>
